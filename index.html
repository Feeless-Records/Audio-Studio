<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio Studio | Hello World</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#10121a;color:#eef1f8;font-family:system-ui,sans-serif;overflow:hidden}
main{height:100%;display:grid;place-content:center;text-align:center;gap:12px}
h1{font-size:clamp(2.5rem,7vw,5rem);margin:0}
p{margin:0;color:#aeb5c6}
.fly-track{position:fixed;top:14%;left:0;width:100%;height:150px;overflow:hidden;pointer-events:none}
#flying,.fly-track>svg,#flying-label{display:block;position:absolute;top:0;left:0;width:min(540px,75vw);height:100px;animation:fly 4s linear infinite alternate;will-change:left,transform}
#flying{opacity:.16}#flying-label{position:absolute;top:0;left:0;width:min(540px,75vw);height:100px;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,3.3vw,37px);font-weight:900;white-space:nowrap;color:#ffb542;text-shadow:0 0 12px #fb923c,0 0 28px #ea580c;animation:fly 4s linear infinite alternate;will-change:left,transform}\n@keyframes fly{from{left:0;transform:translateY(0)}to{left:calc(100% - min(540px, 75vw));transform:translateY(35px)}}
#status{position:fixed;bottom:16px;left:20px;font-size:12px;color:#92a0b6}
@media(prefers-reduced-motion:reduce){#flying,.fly-track>svg,#flying-label{animation:none;left:50%;transform:translateX(-50%)}}
</style>
<script src="app.js" defer></script>
</head>
<body>
<main id="app"></main>
<div class="fly-track"><canvas id="flying" aria-label="Saatana! Perkele!"></canvas><div id="flying-label" aria-label="Animated text"></div></div>
<div id="status" role="status">Initializing WebAssembly and WebGPU…</div>
</body>
</html>
