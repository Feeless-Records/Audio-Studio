<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio Studio | Hello World</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#10121a;color:#eef1f8;font-family:system-ui,sans-serif;overflow:hidden}
main{height:100%;display:grid;place-content:center;text-align:center;gap:12px}
h1{font-size:clamp(2.5rem,7vw,5rem);margin:0}
p{margin:0;color:#aeb5c6}
.fly-track{position:fixed;top:14%;left:0;width:100%;height:100px;overflow:hidden;pointer-events:none}
#flying{display:block;position:absolute;top:0;left:0;width:min(540px,75vw);height:100px;animation:fly 5s ease-in-out infinite alternate;will-change:transform}
@keyframes fly{from{transform:translateX(0)}to{transform:translateX(calc(100vw - 100%))}}
#status{position:fixed;bottom:16px;left:20px;font-size:12px;color:#92a0b6}
@media(prefers-reduced-motion:reduce){#flying{animation:none}}
</style>
<script src="app.js" defer></script>
</head>
<body>
<main id="app"></main>
<div class="fly-track"><canvas id="flying" aria-label="Saatana! Perkele!"></canvas></div>
<div id="status" role="status">Initializing WebAssembly and WebGPU…</div>
</body>
</html>
