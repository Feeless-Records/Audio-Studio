<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio Studio | GPU Vector Text</title>
<style>
html,body{margin:0;min-height:100%;background:#10121a;color:#eef1f8;font:16px system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{padding:16px 22px;display:flex;align-items:center;flex-wrap:wrap;gap:12px;background:#191d29}
header label{font-weight:700}
input{flex:1;min-width:180px;max-width:620px;padding:10px;border:1px solid #434b61;border-radius:7px;background:#0e1220;color:white;font:inherit}
#status{font-size:13px;color:#afbed3}
#stage{display:block;flex:1;width:100%;height:70vh;min-height:320px}
footer{padding:12px 22px;color:#aeb5c6;font-size:13px}
</style>
<script src="app.js" defer></script>
</head>
<body>
<header><label for="message">Vector text</label><input id="message" value="Saatana! Perkele!" maxlength="100" aria-label="Animated text"><span id="status">Starting…</span></header>
<canvas id="stage" aria-label="Animated WebGPU vector text"></canvas>
<footer>Text input → WebAssembly layout → vector rectangles → WebGPU triangles. SVG fallback when WebGPU is unavailable. Basic ASCII 5×7 font.</footer>
</body></html>
